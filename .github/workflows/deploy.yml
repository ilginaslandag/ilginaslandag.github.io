name: Haberleri çek ve yayınla

on:
  push:
    branches: [main]
  schedule:
    # GitHub'ın ücretsiz zamanlayıcısı planlı çalışmaların önemli kısmını atlıyor
    # (bu repoda ~%70 gözlendi). Saatte 4 tenha dakika: atlamalara rağmen
    # ortalama güncelleme aralığını ~30 dk civarında tutar.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  # Saatlik Claude bulut bekçisi bu olayla tetikler (repository_dispatch yalnızca
  # contents:write ister; bekçinin ortam kimliğinin actions:write'ı yok).
  repository_dispatch:
    types: [tetik]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Haberleri çek (news.json üret)
        run: node scripts/fetch-news.js
      - name: Telefona bildirim gönder (Vercel /api/notify — bulut bekçisiyle ortak hafıza)
        if: github.event_name != 'push'
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: |
          [ -z "$NOTIFY_URL" ] && { echo "NOTIFY_URL secret yok, atlandı"; exit 0; }
          curl -s --max-time 90 "$NOTIFY_URL" || echo "bildirim ucu yanıt vermedi (yayını engellemez)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
